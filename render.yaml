services:
  - type: web
    name: exam-practice-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        value: https://exam-practice-frontend-kelt.onrender.com

  - type: web
    name: exam-practice-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: 24.8.0
      - key: REACT_APP_API_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://exam-practice-backend-1h2z.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
