services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - backend-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-exam_practice_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - '${PORT:-5000}:5000'
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ['monitoring']
    restart: unless-stopped
    ports:
      - '3001:3001'
    volumes:
      - uptime_kuma_data:/app/data
    depends_on:
      - backend
    networks:
      - frontend-net

volumes:
  mongo_data:
  backend_logs:
  uptime_kuma_data:

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
